name: Bug report
description: Report a reproducible Duet problem.
body:
  - type: markdown
    attributes:
      value: "Redact participant credentials and private task data. A minimal reproduction is more useful than a complete live board."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, agent clients/versions, and copy or symlink installation.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Relevant prompt or utility commands, launch order, and execution environment.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal supporting output
      description: Redacted errors or message IDs; avoid pasting connection records or full CLI histories.
